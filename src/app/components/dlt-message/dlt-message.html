<body>
    <div class="error-container">
        <div class="error-icon">✕</div>
        <h1>Deletion Failed</h1>
        <p>We were unable to delete the item. Please review the error details below and try again.</p>
        
        <div class="error-details">
            <strong>Error Details:</strong>
            <p>Incorrect password</p>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" (click)="again()">Try Again</button>
            <button class="btn btn-secondary" (click)="dashboard()">Go Back</button>
        </div>
    </div>
</body>

@if (error()) {
<app-error-card [errormessage] = "errormessage"></app-error-card>
} @else {
   <form #loginForm="ngForm" (ngSubmit)="handleLogin()">
    <div class="form-group">
        <label for="email">Email Address</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            ngModel
            #email="ngModel"
            placeholder="Enter your email" 
            required>
    </div>
    
    <div class="form-group">
        <label for="password">Password</label>
        <input 
            type="password" 
            id="password" 
            name="password" 
            ngModel
            #password="ngModel"
            placeholder="Enter your password" 
            required>
    </div>
    
    <button type="submit" class="login-btn">Sign In</button>
    <a href={{oath}}
    style="display: inline-flex; align-items: center; padding: 10px 20px; background-color: white; border: 1px solid #dadce0; border-radius: 4px; text-decoration: none; font-family: 'Roboto', Arial, sans-serif; font-size: 14px; font-weight: 500; color: #3c4043; transition: background-color 0.3s, box-shadow 0.3s;">
        <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" alt="Google logo" style="width: 18px; height: 18px; margin-right: 10px;">
        Sign in with Google
    </a>
</form> 
}


 

<!-- In your template -->
 @if (isLoading()) {
    <div class="loading-spinner">
    <!-- Or download as GIF -->
    <img src="/loading.gif">
    </div>
 }

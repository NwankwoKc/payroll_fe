@if (loadstate.loading) {
    <div class="loading-spinner">
    <!-- Or download as GIF -->
    <img src="/loading.gif">
    </div>
} @else if (loadstate.error) {
<app-error-card [errormessage] = "errormessage"></app-error-card>
} @else {
    <div class="employee-container">
        <div class="employee-header">
            <h1>Employee Directory</h1>
            <p>Meet our amazing team members</p>
        </div>

        <div class="employee-content">
            <div class="search-filter-section">
                <input type="text" class="search-box" placeholder="Search employees by name..." id="searchInput" [(ngModel)] = "name">
                <select class="filter-select" id="genderFilter" [(ngModel)] ="gender">
                    <option value="">All Genders</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                <select class="filter-select" id="genderFilter" [(ngModel)] ="depart">
                    <option value="">All Departments</option>
                    @for (dp of departments; track dp.name) {
                        <option value={{dp.id}}>{{dp.name}}</option>
                    }
                </select>
                <button (click)="search()">Search</button>
            </div>

            <div class="stats-section">
                <h3>Team Overview</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="totalEmployees">{{lent}}</span>
                        <div class="stat-label">Total Employees</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="maleCount">{{male}}</span>
                        <div class="stat-label">Male</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="femaleCount">{{female}}</span>
                        <div class="stat-label">Female</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="departmentCount">{{department}}</span>
                        <div class="stat-label">Departments</div>
                    </div>
                </div>
            </div>

            <div class="employees-grid" id="employeesGrid" *ngFor="let employee of employees">
                <div class="employee-card">
                    <div class="employee-card-header">
                        <img [src]="employee.profileimage" alt="Employee photo" class="employee-image">
                        <div class="employee-status" [class.active]="employee.isActive"></div>
                    </div>
                    <div class="employee-card-body">
                        <h3 class="employee-name">{{employee.firstname}} {{employee.lastname}}</h3>
                        <div class="employee-contact">
                            <span class="employee-email">{{employee.email}}</span>
                        </div>
                    </div>
                    <div class="employee-card-footer">
                        <a class="view-details-btn" [routerLink]="['/profile',employee.id]" style="text-decoration: none;">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
}
